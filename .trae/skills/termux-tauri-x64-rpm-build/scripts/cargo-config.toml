# Place at <project>/src-tauri/.cargo/config.toml
# Device-local build configuration for cross-compiling to x86_64 Linux on Termux.
# Do not commit it: the paths are phone-specific.

[build]
target = "x86_64-unknown-linux-gnu"
jobs = 3

[target.x86_64-unknown-linux-gnu]
linker = "/data/data/com.termux/files/home/xbuild/x86gcc"

[env]
PKG_CONFIG_SYSROOT_DIR = { value = "/data/data/com.termux/files/home/xsys", force = true }
PKG_CONFIG_LIBDIR = { value = "/data/data/com.termux/files/home/xsys/usr/lib/x86_64-linux-gnu/pkgconfig:/data/data/com.termux/files/home/xsys/usr/share/pkgconfig:/data/data/com.termux/files/home/xsys/usr/lib/pkgconfig", force = true }
PKG_CONFIG_ALLOW_CROSS = { value = "1", force = true }
CC_x86_64_unknown_linux_gnu = { value = "/data/data/com.termux/files/home/xbuild/x86gcc", force = true }
AR_x86_64_unknown_linux_gnu = { value = "/data/data/com.termux/files/usr/bin/llvm-ar", force = true }
