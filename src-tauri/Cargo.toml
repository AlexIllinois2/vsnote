[package]
name = "vsnote"
version = "1.1.0"
description = "A lightweight cross-platform Markdown editor"
authors = ["TizuMark"]
edition = "2021"
license = "GPL-3.0"

[lib]
name = "markdown_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.5", features = ["devtools"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-shell = "2.2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
dirs = "6"
reqwest = { version = "0.12", features = ["rustls-tls"] }
base64 = "0.22"
md-5 = "0.10"
imagesize = "0.13"
encoding_rs = "0.8"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"

[patch.crates-io]
brotli = { git = "https://github.com/dropbox/rust-brotli", rev = "9cbed81a1a098fcd4ffcf956429dce6154415970" }
# 本机 Windows 构建专用：schemars 0.8.22 在 preserve_order feature 下与 indexmap 1.x
# 冲突（E0107: struct takes 3 generic arguments but 2 were supplied）。
# 用已把 indexmap 依赖升到 2.x 的本地副本替换；该副本位于 C:/Users/45574/vsbuild/patches/schemars。
# 若在没有该副本的机器上构建，删掉这一行即可（Linux/macOS 不受影响）。
# Linux/macOS 构建时此 patch 行已被移除（Windows 构建前请自行加回）。
